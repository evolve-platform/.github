name: Jira on merge

# Tells Jira about a pull request into the default branch through a Jira
# Automation incoming webhook: the issue named in the head branch, the event's
# action and whether the pull request was merged, so the rule decides what to do.
# A plain GitHub webhook cannot send the token header that trigger requires, so
# the call is made from a job.
on:
  workflow_call:
    inputs:
      key-pattern:
        description: Extended regex for the issue key in the head branch name
        type: string
        default: "EV-[0-9]+"
    secrets:
      JIRA_MERGE_WEBHOOK_URL:
        required: true
      JIRA_MERGE_WEBHOOK_TOKEN:
        required: true

permissions: {}

jobs:
  transition:
    # A stacked pull request into another branch says nothing about the issue yet.
    if: >-
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Transition the branch's issue
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
          BASE: ${{ github.event.pull_request.base.ref }}
          PATTERN: ${{ inputs.key-pattern }}
          URL: ${{ secrets.JIRA_MERGE_WEBHOOK_URL }}
          TOKEN: ${{ secrets.JIRA_MERGE_WEBHOOK_TOKEN }}
        run: |
          # A caller that passes the secrets from an org secret its repository
          # cannot see sends empty strings, which `required` does not catch.
          if [ -z "$URL" ] || [ -z "$TOKEN" ]; then
            echo "::error::JIRA_MERGE_WEBHOOK_URL or JIRA_MERGE_WEBHOOK_TOKEN is empty; check that the org secrets exist and are shared with ${GITHUB_REPOSITORY}."
            exit 1
          fi
          key=$(printf '%s' "$BRANCH" | grep -oE "$PATTERN" | head -n1 || true)
          if [ -z "$key" ]; then
            echo "No issue key in $BRANCH, nothing to do."
            exit 0
          fi
          curl --fail -sS -X POST "$URL" \
            -H "Content-Type: application/json" \
            -H "X-Automation-Webhook-Token: $TOKEN" \
            -d "$(jq -cn --arg key "$key" --arg action "$ACTION" --arg base "$BASE" --argjson merged "${MERGED:-false}" \
              '{issues: [$key], action: $action, pull_request: {merged: $merged, base: {ref: $base}}}')"
          echo "Sent $key ($ACTION, merged=$MERGED)."
